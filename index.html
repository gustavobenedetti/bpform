<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060A;--surface:#0E0E14;--surface-hover:#15151E;--border:#1E1E2A;--accent:#3B82F6;--accent-light:#60A5FA;--accent-glow:rgba(59,130,246,0.15);--green:#00B85C;--green-light:#00D26A;--green-glow:rgba(0,184,92,0.25);--white:#F4F4F5;--text:#A1A1AA;--muted:#52525B;--error:#EF4444;--radius:14px}
html,body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--white);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* BG */
.bg-canvas{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;animation:orb-float 14s ease-in-out infinite}
.bg-orb-1{width:500px;height:500px;background:radial-gradient(circle,rgba(59,130,246,.2),transparent 70%);top:-15%;left:-10%;transition:background 1.5s ease}
.bg-orb-2{width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,.12),transparent 70%);bottom:-10%;right:-10%;animation-duration:18s;animation-delay:-4s}
@keyframes orb-float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.05)}50%{transform:translate(-20px,30px) scale(.95)}75%{transform:translate(20px,20px) scale(1.02)}}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%)}
.particle{position:fixed;width:2px;height:2px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:0;opacity:0;animation:pdrift 8s ease-in-out infinite}
@keyframes pdrift{0%{opacity:0;transform:translateY(0)}20%{opacity:.4}80%{opacity:.2}100%{opacity:0;transform:translateY(-200px) scale(.5)}}

/* PROGRESS */
.progress-wrapper{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,6,10,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.progress-bar{height:3px;background:var(--border);width:100%;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light),#818CF8);width:0%;transition:width .6s cubic-bezier(.22,1,.36,1);position:relative}
.progress-fill::after{content:'';position:absolute;right:0;top:-3px;width:10px;height:9px;background:var(--accent-light);border-radius:50%;box-shadow:0 0 14px var(--accent),0 0 30px var(--accent-glow);opacity:0;transition:opacity .3s}
.progress-fill[style*="width"]:not([style*="width: 0"])::after{opacity:1}
.progress-info{display:flex;justify-content:space-between;padding:10px 24px}
.progress-info.hidden{display:none}
.progress-step,.progress-counter{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* CONTAINER */
.container{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 40px;position:relative;z-index:1;width:100%}

/* SCREENS */
.screen{position:absolute;width:100%;max-width:520px;padding:0 20px;opacity:0;transform:translateX(40px);transition:opacity .38s cubic-bezier(.4,0,.2,1),transform .38s cubic-bezier(.4,0,.2,1);pointer-events:none;text-align:center;box-sizing:border-box;will-change:opacity,transform}
.screen.active{opacity:1;transform:translateX(0);pointer-events:all}
.screen.exit-left{opacity:0;transform:translateX(-40px)}

/* TITLE */
.title{font-size:clamp(15px,4vw,21px);font-weight:900;line-height:1.2;color:var(--white);letter-spacing:-.03em;margin-bottom:10px}
.title .green{color:var(--green)}
.subtitle{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:8px;max-width:380px;margin-left:auto;margin-right:auto}

/* PROMISE */
.promise{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(0,184,92,.08);border:1px solid rgba(0,184,92,.2);border-radius:100px;font-size:13px;font-weight:600;color:var(--green);margin-bottom:24px}
.promise-icon{font-size:16px}

/* CHART */
.chart-wrap{width:100%;max-width:340px;height:120px;margin:0 auto 28px;position:relative;overflow:hidden}
.chart-svg{width:100%;height:100%}
.chart-line{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:500;stroke-dashoffset:500;animation:draw-chart 2s cubic-bezier(.22,1,.36,1) .5s forwards}
.chart-area{fill:url(#chartGrad);opacity:0;animation:fade-area .8s ease 1.8s forwards}
.chart-dot{fill:var(--green);r:4;opacity:0;animation:pop-dot .3s ease forwards}
.chart-dot:nth-child(1){animation-delay:2s}
.chart-dot:nth-child(2){animation-delay:2.1s}
.chart-dot:nth-child(3){animation-delay:2.2s}
.chart-dot:nth-child(4){animation-delay:2.3s}
.chart-dot:nth-child(5){animation-delay:2.4s}
.chart-glow{fill:var(--green);r:4;opacity:0;filter:blur(6px);animation:pop-dot .3s ease 2.4s forwards}
.chart-label{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;color:var(--green);opacity:0;animation:fade-in .4s ease 2.2s forwards;display:flex;align-items:center;gap:4px}
.chart-label svg{width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2.5}
@keyframes draw-chart{to{stroke-dashoffset:0}}
@keyframes fade-area{to{opacity:.3}}
@keyframes pop-dot{to{opacity:1;transform:scale(1)}}
@keyframes fade-in{to{opacity:1}}

/* GRID LINES */
.chart-gridline{stroke:rgba(255,255,255,.04);stroke-width:1}

/* BTN — pulsing glow */
.btn{width:100%;max-width:280px;padding:14px 24px;background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;border:none;border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:16px;font-weight:800;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 20px var(--green-glow);margin:0 auto;display:block;transition:transform .2s;letter-spacing:.02em;animation:heartbeat 1.8s ease-in-out infinite}
.btn::before{content:'';position:absolute;inset:-3px;border-radius:17px;background:linear-gradient(135deg,var(--green),var(--green-light),#00F07C,var(--green-light),var(--green));background-size:300% 300%;animation:border-glow 4s ease-in-out infinite;z-index:-1;opacity:.6;filter:blur(10px)}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%);transition:width .5s,height .5s}
.btn:active{transform:scale(.96)}
.btn:active::after{width:300px;height:300px}
@keyframes heartbeat{0%{transform:scale(1);box-shadow:0 4px 20px var(--green-glow)}12%{transform:scale(1.03);box-shadow:0 6px 30px rgba(0,184,92,.45)}18%{transform:scale(1);box-shadow:0 4px 20px var(--green-glow)}28%{transform:scale(1.04);box-shadow:0 6px 35px rgba(0,184,92,.5),0 0 60px rgba(0,184,92,.15)}38%{transform:scale(1);box-shadow:0 4px 20px var(--green-glow)}100%{transform:scale(1);box-shadow:0 4px 20px var(--green-glow)}}
@keyframes border-glow{0%,100%{background-position:0% 50%;opacity:.4}50%{background-position:100% 50%;opacity:.7}}

/* AUTHORITY */
.authority-row{display:flex;justify-content:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.authority-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:90px;flex:1;max-width:140px;min-height:80px;text-align:center}
.authority-number{font-size:18px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.authority-label{font-size:9px;color:var(--muted);text-align:center;line-height:1.3;font-weight:500;letter-spacing:.04em;text-transform:uppercase}

/* INPUTS */
.input-label{display:block;font-size:18px;font-weight:700;color:var(--white);margin-bottom:14px;text-align:left}

/* DESEJO OPTIONS */
.desejo-options{display:flex;flex-direction:column;gap:10px;width:100%}
.desejo-btn{width:100%;padding:16px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .18s,background .18s,color .18s,box-shadow .18s;text-align:center;-webkit-tap-highlight-color:transparent}
.desejo-btn:hover{border-color:rgba(59,130,246,.25);background:var(--surface-hover);color:var(--white)}
.desejo-btn:active{transform:scale(.98);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);color:var(--white)}
.input-field{width:100%;padding:16px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--white);font-family:'Inter',sans-serif;font-size:16px;outline:none;transition:border-color .3s,box-shadow .3s;-webkit-appearance:none;margin-bottom:6px}
.input-field::placeholder{color:var(--muted)}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.input-field.error{border-color:var(--error)}
.input-hint{font-size:12px;min-height:18px;margin-bottom:8px;text-align:left}
.input-hint.error-msg{color:var(--error)}
.input-group{margin-bottom:4px}

/* BTN ROW */
.btn-row{display:flex;gap:10px;margin-top:8px;width:100%}
.btn-row .btn{flex:1}
.btn-back{background:transparent;color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 20px;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:all .25s;-webkit-tap-highlight-color:transparent;min-width:56px;flex:0}
.btn-back:hover{border-color:var(--muted);color:var(--white)}

/* SUCCESS */
.success-icon{width:64px;height:64px;border-radius:50%;background:rgba(0,184,92,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:success-pop .5s cubic-bezier(.22,1,.36,1)}
.success-icon svg{width:32px;height:32px;stroke:var(--green);stroke-width:2.5}
@keyframes success-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* THANK YOU */
.thank-you-msg{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:24px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.thank-you-msg strong{color:var(--white)}

/* RESPONSIVE */
@media(max-width:480px){.container{padding:56px 16px 30px}.title{font-size:clamp(20px,6vw,28px)}.authority-card{padding:10px 8px;min-width:80px}.authority-number{font-size:16px}.authority-label{font-size:8px}.chart-wrap{height:100px}}
@media(hover:none){.btn:hover{transform:none}}

.brand-footer{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.12em;opacity:.4;z-index:10;text-transform:uppercase}
</style>
</head>
<body>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none"></iframe>

<div class="bg-canvas"><div class="bg-orb bg-orb-1"></div><div class="bg-orb bg-orb-2"></div></div>
<div class="bg-grid"></div>
<div class="particle" style="left:10%;top:80%;animation-delay:0s"></div>
<div class="particle" style="left:50%;top:90%;animation-delay:3s"></div>
<div class="particle" style="left:85%;top:75%;animation-delay:1.5s"></div>
<div class="particle" style="left:30%;top:85%;animation-delay:2s"></div>
<div class="particle" style="left:65%;top:95%;animation-delay:4.5s"></div>
<div class="particle" style="left:15%;top:70%;animation-delay:5s"></div>
<div class="particle" style="left:75%;top:88%;animation-delay:6s"></div>
<div class="particle" style="left:45%;top:78%;animation-delay:7s"></div>

<div class="progress-wrapper">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-info hidden" id="progressInfo">
    <span class="progress-step" id="progressLabel"></span>
    <span class="progress-counter" id="progressCounter"></span>
  </div>
</div>

<div class="container">

  <!-- INTRO -->
  <div class="screen active" id="screen-intro">
    <h1 class="title">VOCÊ É EMPRESÁRIO(A) E QUER <span class="green">AUMENTAR O RESULTADO</span> DO COMERCIAL?</h1>

    <button class="btn" id="startBtn">QUERO!</button>
  </div>

  <!-- NOME -->
  <div class="screen" id="screen-nome">
    <div class="input-group">
      <label class="input-label">Qual é o seu nome?</label>
      <input type="text" class="input-field" id="fNome" placeholder="Seu nome completo" autocomplete="name" enterkeyhint="next">
      <div class="input-hint" id="hintNome"></div>
    </div>
    <div class="btn-row">
      <button class="btn-back" onclick="showScreen('intro','back')">←</button>
      <button class="btn" onclick="submitNome()">Continuar</button>
    </div>
  </div>

  <!-- WHATSAPP -->
  <div class="screen" id="screen-whatsapp">
    <div class="input-group">
      <label class="input-label" id="labelWhatsapp">Qual o seu WhatsApp?</label>
      <input type="tel" class="input-field" id="fWhatsapp" placeholder="(00) 00000-0000" autocomplete="tel" enterkeyhint="next">
      <div class="input-hint" id="hintWhatsapp"></div>
    </div>
    <div class="btn-row">
      <button class="btn-back" onclick="showScreen('nome','back')">←</button>
      <button class="btn" onclick="submitWhatsapp()">Continuar</button>
    </div>
  </div>

  <!-- ÁREA -->
  <div class="screen" id="screen-area">
    <div class="input-group">
      <label class="input-label">Qual a sua área de atuação?</label>
      <input type="text" class="input-field" id="fArea" placeholder="Ex: Advocacia, Tecnologia, Imobiliário..." autocomplete="off" enterkeyhint="next">
      <div class="input-hint" id="hintArea"></div>
    </div>
    <div class="btn-row">
      <button class="btn-back" onclick="showScreen('whatsapp','back')">←</button>
      <button class="btn" onclick="submitArea()">Continuar</button>
    </div>
  </div>

  <!-- DESEJO -->
  <div class="screen" id="screen-desejo">
    <label class="input-label" style="text-align:center;margin-bottom:18px">Seu principal desejo é:</label>
    <div class="desejo-options" id="desejoOptions">
      <button class="desejo-btn" onclick="submitDesejo('Captar mais leads')">Captar mais leads</button>
      <button class="desejo-btn" onclick="submitDesejo('Converter mais leads em clientes')">Converter mais leads em clientes</button>
      <button class="desejo-btn" onclick="submitDesejo('Melhorar meu preço')">Melhorar meu preço</button>
      <button class="desejo-btn" onclick="submitDesejo('Formatar time de vendas')">Formatar time de vendas</button>
    </div>
    <div style="margin-top:14px">
      <button class="btn-back" onclick="showScreen('area','back')">← Voltar</button>
    </div>
  </div>

  <!-- OBRIGADO -->
  <div class="screen" id="screen-thanks">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="title" id="thanksTitle" style="font-size:22px">Recebemos suas informações!</h1>
    <div class="thank-you-msg">Fique atento(a)! Em breve um executivo entrará em contato!</div>
    <a class="btn" href="https://instagram.com/gustavoobenedetti" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">CONCLUIR</a>
  </div>

</div>

<div class="brand-footer">Branches Performance</div>

<script>
const CONFIG = {
  webhookUrl: 'https://script.google.com/macros/s/AKfycbwGn_dz4gG4jqfxtqf0mKd8jRxcZDVaOjdBXH9fduYtW3yquNCn5-AuRfG6a79C-oTg/exec'
};

let formData = {};
let _active = null;
const screens = {
  intro: document.getElementById('screen-intro'),
  nome: document.getElementById('screen-nome'),
  whatsapp: document.getElementById('screen-whatsapp'),
  area: document.getElementById('screen-area'),
  desejo: document.getElementById('screen-desejo'),
  thanks: document.getElementById('screen-thanks')
};

Object.values(screens).forEach(s => s.style.display = 'block');
_active = screens.intro;
screens.intro.classList.add('active');

const exitStyle = document.createElement('style');
exitStyle.textContent = '.screen.exit-right{opacity:0;transform:translateX(40px)}';
document.head.appendChild(exitStyle);

function showScreen(name, dir) {
  const next = screens[name];
  if (_active) {
    const cur = _active;
    cur.classList.add(dir === 'back' ? 'exit-right' : 'exit-left');
    setTimeout(() => cur.classList.remove('active','exit-left','exit-right'), 380);
  }
  next.style.transform = dir === 'back' ? 'translateX(-40px)' : 'translateX(40px)';
  next.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    next.classList.add('active');
    next.style.transform = '';
    next.style.opacity = '';
  }));
  _active = next;
  updateProgress(name);
  if (name === 'nome') setTimeout(() => document.getElementById('fNome').focus(), 400);
  if (name === 'whatsapp') setTimeout(() => document.getElementById('fWhatsapp').focus(), 400);
  if (name === 'area') setTimeout(() => document.getElementById('fArea').focus(), 400);
}

function updateProgress(name) {
  const map = { intro: 0, nome: 20, whatsapp: 40, area: 60, desejo: 80, thanks: 100 };
  const labels = { intro: '', nome: 'Nome', whatsapp: 'WhatsApp', area: 'Área', desejo: 'Desejo', thanks: 'Concluído' };
  const counters = { intro: '', nome: '1/4', whatsapp: '2/4', area: '3/4', desejo: '4/4', thanks: '' };
  document.getElementById('progressFill').style.width = (map[name] || 0) + '%';
  const info = document.getElementById('progressInfo');
  if (name === 'intro') { info.classList.add('hidden'); }
  else { info.classList.remove('hidden'); }
  document.getElementById('progressLabel').textContent = labels[name] || '';
  document.getElementById('progressCounter').textContent = counters[name] || '';
}

function sendToSheet(etapa) {
  try {
    const payload = { ...formData, etapa };
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = CONFIG.webhookUrl;
    form.target = 'hidden_iframe';
    form.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 3000);
  } catch(e) {}
}

// START
document.getElementById('startBtn').addEventListener('click', () => showScreen('nome'));

// NOME
function submitNome() {
  const val = document.getElementById('fNome').value.trim();
  if (val.length < 2) {
    document.getElementById('fNome').classList.add('error');
    document.getElementById('hintNome').textContent = 'Informe seu nome';
    document.getElementById('hintNome').classList.add('error-msg');
    return;
  }
  document.getElementById('fNome').classList.remove('error');
  document.getElementById('hintNome').textContent = '';
  formData.nome = val;
  sendToSheet('nome');
  document.getElementById('labelWhatsapp').textContent = val.split(' ')[0] + ', qual o seu WhatsApp?';
  showScreen('whatsapp');
}

// WHATSAPP
document.getElementById('fWhatsapp').addEventListener('input', function() {
  let v = this.value.replace(/\D/g,'');
  if(v.length>11) v=v.slice(0,11);
  let f='';
  if(v.length>0) f='('+v.slice(0,2);
  if(v.length>2) f+=') '+v.slice(2,7);
  if(v.length>7) f+='-'+v.slice(7,11);
  this.value=f;
});

function submitWhatsapp() {
  const val = document.getElementById('fWhatsapp').value.trim();
  const digits = val.replace(/\D/g,'');
  if (digits.length < 10 || digits.length > 11) {
    document.getElementById('fWhatsapp').classList.add('error');
    document.getElementById('hintWhatsapp').textContent = 'Informe um número válido';
    document.getElementById('hintWhatsapp').classList.add('error-msg');
    return;
  }
  document.getElementById('fWhatsapp').classList.remove('error');
  document.getElementById('hintWhatsapp').textContent = '';
  formData.whatsapp = val;
  if (typeof fbq !== 'undefined') fbq('track', 'Lead');
  sendToSheet('whatsapp');
  showScreen('area');
}

function submitArea() {
  const val = document.getElementById('fArea').value.trim();
  if (val.length < 2) {
    document.getElementById('fArea').classList.add('error');
    document.getElementById('hintArea').textContent = 'Informe sua área de atuação';
    document.getElementById('hintArea').classList.add('error-msg');
    return;
  }
  document.getElementById('fArea').classList.remove('error');
  document.getElementById('hintArea').textContent = '';
  formData.area = val;
  sendToSheet('area');
  showScreen('desejo');
}

function submitDesejo(desejo) {
  formData.desafio = desejo;
  sendToSheet('concluido');
  document.getElementById('thanksTitle').textContent = formData.nome.split(' ')[0] + ', recebemos suas informações!';
  showScreen('thanks');
  const orb = document.querySelector('.bg-orb-1');
  if(orb) orb.style.background='radial-gradient(circle, rgba(16,185,129,.25), transparent 70%)';
  setTimeout(confetti, 400);
}

// ENTER
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (_active === screens.intro) showScreen('nome');
    else if (_active === screens.nome) submitNome();
    else if (_active === screens.whatsapp) submitWhatsapp();
    else if (_active === screens.area) submitArea();
  }
});

// CONFETTI
function confetti(){
  const c=['#3B82F6','#00B85C','#F59E0B','#EC4899','#8B5CF6','#fff'];
  for(let i=0;i<40;i++){setTimeout(()=>{const e=document.createElement('div');e.style.cssText=`position:fixed;pointer-events:none;z-index:999;left:${Math.random()*100}vw;top:${Math.random()*40+10}vh;width:${Math.random()*8+4}px;height:${Math.random()*8+4}px;background:${c[Math.floor(Math.random()*c.length)]};border-radius:${Math.random()>.5?'50%':'2px'}`;document.body.appendChild(e);e.animate([{opacity:1,transform:'translate(0,0) rotate(0deg)'},{opacity:0,transform:`translate(${(Math.random()-.5)*200}px,${Math.random()*300+100}px) rotate(${Math.random()*720}deg)`}],{duration:Math.random()*1500+1000,easing:'ease-out',fill:'forwards'}).onfinish=()=>e.remove()},i*25)}
}

</script>
